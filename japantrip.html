<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="A complete interactive itinerary for Japan Journey 2026.">
<meta property="og:title" content="Japan Journey 2026">
<meta property="og:description" content="November 2–13, 2026 · Tokyo, Hakone, Nara, Nagoya, Toyohashi, Saitama — flights, hotels, trains, and restaurants for the crew.">
<meta property="og:image" content="https://brandoncamerer-trips.github.io/japan-trip/preview.webp">
<meta property="og:url" content="https://brandoncamerer-trips.github.io/japan-trip/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Japan Journey 2026">
<meta name="twitter:description" content="November 2–13, 2026 · Tokyo, Hakone, Nara, Nagoya, Toyohashi, Saitama — flights, hotels, trains, and restaurants for the crew.">
<meta name="twitter:image" content="https://brandoncamerer-trips.github.io/japan-trip/preview.webp">

<title>Japan Journey 2026</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="512x512" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
:root {
  --bg: #f2f5f2;
  --ink: #183246;
  --card: #fffdf8;
  --muted: #687974;
  --line: #d7e0db;
  --navy: #12364d;
  --red: #b54841;
  --gold: #d6aa4d;
  --green: #34796c;
  --shadow: 0 14px 42px rgba(18, 48, 66, .09);
  color-scheme: light;
}

html[data-theme="dark"] {
  --bg: #09171f;
  --ink: #e6efec;
  --card: #10242d;
  --muted: #a3b3af;
  --line: #29414a;
  --navy: #0a2432;
  --shadow: 0 14px 42px rgba(0, 0, 0, .24);
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  transition: .25s;
}

button,
a {
  font: inherit;
}

button {
  cursor: pointer;
}

a {
  color: inherit;
}

button:focus-visible,
a:focus-visible,
input:focus-visible {
  outline: 3px solid #e6a85a;
  outline-offset: 3px;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(16, 47, 69, .96);
  border-bottom: 1px solid #ffffff18;
  color: #fff;
  box-shadow: 0 8px 24px #102f451c;
}

.topbar-inner {
  max-width: 1120px;
  height: 64px;
  margin: auto;
  padding: 0 20px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand {
  font-weight: 800;
}

.top-actions {
  margin-left: auto;
  display: flex;
  gap: 6px;
}

.icon-btn {
  width: 40px;
  height: 40px;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: #fff;
  font-size: 18px;
}

.icon-btn:hover {
  background: #ffffff18;
}

.icon-btn svg {
  display: block;
  width: 19px;
  height: 19px;
  margin: auto;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.hero {
  position: relative;
  overflow: hidden;
  background: linear-gradient(125deg, #102f45, #163e54 58%, #285f66);
  color: #fff;
  text-align: center;
}

.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  opacity: .1;
  background-image:
    linear-gradient(#ffffff2e 1px, transparent 1px),
    linear-gradient(90deg, #ffffff2e 1px, transparent 1px);
  background-size: 56px 56px;
}

.hero-inner {
  position: relative;
  max-width: 1120px;
  margin: auto;
  padding: 42px 20px 46px;
}

.eyebrow {
  color: #f3d99b;
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .22em;
}

.kanji {
  margin: 8px 0 2px;
  color: #f3c977;
  font: 700 clamp(3.4rem, 8vw, 5.4rem) / .95 Georgia, serif;
  letter-spacing: -.04em;
  text-shadow: 0 8px 24px #0004;
}

.countdown {
  max-width: 420px;
  margin: 24px auto 0;
  padding: 12px 14px;
  border: 1px solid #ffffff22;
  border-radius: 18px;
  background: #ffffff12;
  backdrop-filter: blur(10px);
}

.countdown-label {
  margin-bottom: 8px;
  color: #f3d99b;
  font-size: 9px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .2em;
}

.units {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
}

.unit + .unit {
  border-left: 1px solid #ffffff22;
}

.num {
  font: 500 24px Georgia, serif;
  font-variant-numeric: tabular-nums;
}

.unit small {
  display: block;
  margin-top: 3px;
  color: #ffffff88;
  font-size: 8px;
  text-transform: uppercase;
  letter-spacing: .14em;
}

/* Refresh Schedule button */
.refresh-schedule {
  margin: 14px auto 0;
  padding: 9px 16px;
  border: 1px solid #ffffff33;
  border-radius: 999px;
  background: #ffffff12;
  color: #fff;
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
  backdrop-filter: blur(8px);
  transition: .2s;
}

.refresh-schedule:hover {
  background: #ffffff22;
  transform: translateY(-1px);
}

.refresh-schedule:active {
  transform: translateY(0);
}

/* Last refreshed timestamp */
.last-refreshed {
  margin-top: 8px;
  color: #ffffff88;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .06em;
}

.page {
  max-width: 1120px;
  margin: auto;
  padding: 36px 18px 64px;
}

.controls {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 20px;
  margin-bottom: 34px;
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: color-mix(in srgb, var(--card) 96%, transparent);
  box-shadow: var(--shadow);
}

.controls-title {
  margin: 0 0 11px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .16em;
}

.views-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  gap: 12px;
  flex-wrap: wrap;
}

.toolbar-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.search-box {
  padding: 8px 14px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--card);
  color: var(--ink);
  font: inherit;
  font-size: 14px;
  width: 170px;
}

.search-box::placeholder {
  color: var(--muted);
}

.tool-btn {
  padding: 8px 14px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--card);
  color: var(--ink);
  font: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}

.food-link {
  display: inline-block;
  margin-top: 8px;
  font-size: 14px;
  color: var(--green);
  text-decoration: none;
  font-weight: 600;
}

.food-link:hover {
  text-decoration: underline;
}

.stay-food {
  position: relative;
  margin-top: 8px;
}

.food-toggle {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 7px 14px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--card);
  color: var(--ink);
  font: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  line-height: 1.4;
}

.food-dropdown {
  position: absolute;
  left: 0;
  top: calc(100% + 6px);
  z-index: 20;
  min-width: 280px;
  max-width: 340px;
  margin-top: 0;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--card);
  box-shadow: var(--shadow);
  padding: 6px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.food-dropdown[hidden] {
  display: none;
}

.food-item {
  display: block;
  padding: 8px 10px;
  border-radius: 8px;
  text-decoration: none;
  color: var(--ink);
}

.food-item:hover {
  background: var(--bg);
}

.food-item strong {
  display: block;
  font-size: 14px;
}

.food-item span {
  display: block;
  font-size: 12px;
  color: var(--muted);
}

.food-item .stars {
  display: inline;
  font-weight: 400;
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
}

.filter-wrap {
  position: relative;
}

.filter-btn {
  color: var(--ink);
  background: var(--card);
  border: 1px solid var(--line);
}

.filter-btn svg {
  width: 20px;
  height: 20px;
  display: block;
  margin: auto;
}

.filter-panel {
  position: absolute;
  right: 0;
  top: calc(100% + 8px);
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow: var(--shadow);
  padding: 14px 16px;
  z-index: 10;
  min-width: 220px;
}

.filter-panel[hidden] {
  display: none;
}

.last-updated {
  margin-top: 10px;
  color: var(--muted);
  font-size: 13px;
}

.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.filter {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--card);
  color: var(--ink);
  font-size: 14px;
  font-weight: 700;
  user-select: none;
}

.filter:has(input:not(:checked)) {
  opacity: .52;
  background: transparent;
}

.filter input {
  width: 16px;
  height: 16px;
  accent-color: var(--red);
}

.chip {
  display: grid;
  place-items: center;
  width: 25px;
  height: 25px;
  border-radius: 8px;
}

.flight {
  background: #f9e5e1;
  color: #a33f39;
}

.rail {
  background: #f8efd7;
  color: #84601c;
}

.visit {
  background: #e2f0eb;
  color: #286e62;
}

.stay {
  background: #e7eef4;
  color: #315e7e;
}

/* Pending confirmation status chip */
.status-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin-left: 8px;
  padding: 4px 8px;
  border: 1px solid #dcc98e;
  border-radius: 999px;
  background: #fff7dc;
  color: #80611e;
  font-size: 9px;
  font-weight: 900;
  line-height: 1;
  text-transform: uppercase;
  letter-spacing: .08em;
  white-space: nowrap;
  vertical-align: middle;
}

.status-chip::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #d6aa4d;
  box-shadow: 0 0 0 2px #d6aa4d22;
}

html[data-theme="dark"] .status-chip {
  border-color: #69582b;
  background: #302b20;
  color: #e4c978;
}

html[data-theme="dark"] .status-chip::before {
  background: #d6aa4d;
  box-shadow: 0 0 0 2px #d6aa4d22;
}

.control-actions {
  display: flex;
  width: 100%;
}

.map-btn,
.done {
  min-height: 44px;
  padding: 0 17px;
  border: 1px solid #b9cec6;
  border-radius: 12px;
  background: #e2efea;
  color: #1f665b;
  font-weight: 800;
  white-space: nowrap;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.map-btn {
  width: 100%;
}

.map-btn:hover {
  filter: brightness(.97);
}

.timeline {
  position: relative;
}

.timeline::before {
  content: "";
  position: absolute;
  top: 30px;
  bottom: 30px;
  left: 38px;
  width: 2px;
  background: linear-gradient(
    var(--red),
    var(--gold) 38%,
    var(--green) 76%,
    var(--navy)
  );
}

.day {
  position: relative;
  display: grid;
  grid-template-columns: 76px minmax(0, 1fr);
  gap: 26px;
  padding-bottom: 20px;
  animation: rise .45s both;
}

.date {
  z-index: 2;
  width: 76px;
  height: 60px;
  display: grid;
  place-items: center;
  border: 4px solid var(--bg);
  border-radius: 16px;
  background: #173b53;
  color: #fff;
  box-shadow: 0 8px 20px #173b532c;
  font-size: 12px;
  font-weight: 900;
  letter-spacing: .08em;
  line-height: 1.35;
  text-align: center;
}
.date-wd {
  font-size: 10px;
  font-weight: 700;
  opacity: .75;
  letter-spacing: .12em;
}

.day-card {
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: var(--card);
  box-shadow: var(--shadow);
  transition: .2s;
}

.day-card:hover {
  transform: translateY(-1px);
}

.day-card.food-open {
  overflow: visible;
}

article.day.food-open {
  position: relative;
  z-index: 5;
}

.day-head {
  width: 100%;
  padding: 17px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  border: 0;
  background: linear-gradient(105deg, #f7efdf, var(--card) 64%);
  color: var(--ink);
  text-align: left;
}

html[data-theme="dark"] .day-head {
  background: linear-gradient(105deg, #302b20, var(--card) 64%);
}

.dest {
  display: block;
  margin-bottom: 3px;
  color: #a57b36;
  font-size: 10px;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: .15em;
}

.place {
  font: 700 clamp(19px, 3vw, 24px) Georgia, serif;
}

.chev {
  font-size: 20px;
  transition: .2s;
}

.collapsed .chev {
  transform: rotate(-90deg);
}

.events {
  border-top: 1px solid var(--line);
}

.collapsed .events {
  display: none;
}

.event {
  display: flex;
  gap: 14px;
  padding: 16px 20px;
}

.event + .event {
  border-top: 1px solid var(--line);
}

.event-icon {
  width: 37px;
  height: 37px;
  flex: 0 0 37px;
  display: grid;
  place-items: center;
  border-radius: 11px;
}

.event-body {
  min-width: 0;
  flex: 1;
}

.type {
  color: var(--muted);
  font-size: 9px;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: .16em;
}

.event-title-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
}

.event h3 {
  margin: 2px 0 0;
  font-size: 16px;
  line-height: 1.45;
}

.event h3 a,
.detail a {
  color: var(--red);
  text-decoration-color: #d6534866;
  text-underline-offset: 4px;
}

.detail {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.55;
}

.reserve {
  padding: 6px 10px;
  border: 1px solid #d8c79f;
  border-radius: 999px;
  background: #fff9eb;
  color: #7c5c1f;
  font-size: 12px;
  font-weight: 800;
}

.empty {
  padding: 24px;
  color: var(--muted);
}

.modal {
  width: min(430px, calc(100% - 32px));
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--card);
  color: var(--ink);
  box-shadow: 0 30px 90px #0006;
}

.modal::backdrop {
  background: #07151db3;
  backdrop-filter: blur(4px);
}

.modal-stripe {
  height: 8px;
  background: linear-gradient(90deg, var(--red), var(--gold), var(--green));
}

.modal-inner {
  padding: 30px;
  text-align: center;
}

.key {
  width: 58px;
  height: 58px;
  margin: auto;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: #e5f1ec;
  font-size: 25px;
}

.modal-label {
  margin: 14px 0 5px;
  color: var(--red);
  font-size: 10px;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: .2em;
}

.modal h2 {
  margin: 0;
  font: 700 25px Georgia, serif;
}

.modal p {
  color: var(--muted);
}

.numbers {
  margin: 22px 0;
  padding: 15px 0;
  border-block: 1px solid var(--line);
  font: 700 18px ui-monospace, monospace;
  line-height: 1.8;
}

.done {
  width: 100%;
  border-color: #173b53;
  background: #173b53;
  color: #fff;
}

@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(10px);
  }

  to {
    opacity: 1;
    transform: none;
  }
}

@media (max-width: 650px) {
  .hero-inner {
    padding: 34px 18px 38px;
  }

  .page {
    padding: 24px 12px 48px;
  }

  .views-row {
    flex-direction: column;
    align-items: stretch;
    gap: 10px;
  }

  .view-tabs {
    gap: 6px;
    width: 100%;
  }

  .view-tab {
    flex: 1 1 0;
    padding: 7px 2px;
    font-size: 13px;
    line-height: 1.15;
    text-align: center;
  }

  .tab-full {
    display: none;
  }

  .tab-short {
    display: inline;
  }

  .toolbar-right {
    width: 100%;
    flex-wrap: wrap;
    gap: 8px;
  }

  .tool-btn {
    padding: 7px 10px;
    font-size: 12px;
  }

  .search-box {
    flex: 1 1 110px;
    width: auto;
    min-width: 0;
    padding: 7px 12px;
    font-size: 13px;
  }

  .map-btn {
    width: 100%;
    text-align: center;
  }

  .timeline::before {
    left: 29px;
  }

  .day {
    grid-template-columns: 58px minmax(0, 1fr);
    gap: 14px;
  }

  .date {
    width: 58px;
    height: 56px;
    font-size: 10px;
  }

  .day-head,
  .event {
    padding: 14px;
  }

  .event-title-row {
    display: block;
  }

  .reserve {
    margin-top: 8px;
  }

  .status-chip {
    margin-left: 0;
    margin-top: 8px;
  }

  .event-icon {
    width: 34px;
    height: 34px;
    flex-basis: 34px;
  }
}

@media (prefers-reduced-motion: reduce) {
  * {
    scroll-behavior: auto !important;
    animation-duration: 1ms !important;
    transition-duration: 1ms !important;
  }
}

@media print {
  @page {
    size: letter;
    margin: .42in;
  }

  html,
  body {
    background: #fff !important;
    color: #183246 !important;
  }

  .topbar,
  .controls,
  .modal,
  .reserve,
  .refresh-schedule,
  .last-refreshed {
    display: none !important;
  }

  .hero {
    background: #173b53 !important;
    print-color-adjust: exact;
    -webkit-print-color-adjust: exact;
  }

  .hero-inner {
    padding: 12px;
  }

  .kanji {
    font-size: 34px;
    text-shadow: none;
  }

  .eyebrow {
    font-size: 9px;
  }

  .countdown {
    display: none;
  }

  .page {
    max-width: none;
    padding: 14px 0;
  }

  .day {
    break-inside: avoid;
    padding-bottom: 7px;
    animation: none;
  }

  .date {
    border-color: #fff;
    print-color-adjust: exact;
    -webkit-print-color-adjust: exact;
  }

  .day-card {
    box-shadow: none;
    transform: none !important;
  }

  .collapsed .events {
    display: block !important;
  }

  .day-head {
    padding: 8px 12px;
  }

  .chev {
    display: none;
  }

  .event {
    padding: 7px 12px;
  }

  .event h3 {
    font-size: 12px;
  }

  .detail {
    font-size: 10px;
  }

  .timeline::before {
    display: none;
  }

  .status-chip {
    print-color-adjust: exact;
    -webkit-print-color-adjust: exact;
  }
}

.view-tabs {
  display: flex;
  gap: 10px;
}

.view-tab {
  padding: 9px 26px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  border-radius: 999px;
  cursor: pointer;
  font: inherit;
  font-weight: 600;
}

.view-tab.active {
  background: var(--navy);
  color: #fff;
  border-color: var(--navy);
}

.tab-short {
  display: none;
}

a.view-tab {
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

/* Mobile tab labels: this block MUST stay after the base .view-tab /
   .tab-short rules above. The earlier @media (max-width: 650px) block
   sits before those base rules, so the base .tab-short { display: none }
   was overriding the mobile .tab-short { display: inline } — leaving
   both the Trains and Monday buttons blank on phones. */
@media (max-width: 650px) {
  .view-tabs {
    gap: 6px;
    width: 100%;
  }

  .view-tab {
    flex: 1 1 0;
    padding: 7px 2px;
    font-size: 13px;
    line-height: 1.15;
    text-align: center;
  }

  .tab-full {
    display: none;
  }

  .tab-short {
    display: inline;
  }
}

  min-height: 420px;
  border-radius: 14px;

const linkify = value => esc(value).replace(
  /([\w.+-]+@[\w.-]+\.[A-Za-z]{2,})/g,
  '<a href="mailto:$1">$1</a>'
);


function hasPendingConfirmation(title) {
  return /pending confirmation/i.test(title);
}


function cleanTitle(title) {
  return title
    .replace(/\s*\([^)]*pending confirmation[^)]*\)/i, "")
    .trim();
}


const WEEKDAYS = {"Nov. 2":"MON","Nov. 3":"TUE","Nov. 4":"WED","Nov. 5":"THU","Nov. 6":"FRI","Nov. 7":"SAT","Nov. 8":"SUN","Nov. 9":"MON","Nov. 10":"TUE","Nov. 11":"WED","Nov. 12":"THU","Nov. 13":"FRI"};
function formatDayLabel(dateStr) {
  const wd = WEEKDAYS[dateStr] ? `<span class="date-wd">${WEEKDAYS[dateStr]}</span>` : "";
  const dt = dateStr.replace("Nov. ", "NOV ");
  return wd ? `${wd}<br>${dt}` : dt;
}


function renderTitle(event) {

  const pending = hasPendingConfirmation(event[3]);
  const clean = cleanTitle(event[3]);

  let title;

  if (event[2] === "Flight" || !event[5]) {
    title = esc(clean);
  } else {
    title = `
      <a
        href="${esc(event[5])}"
        target="_blank"
        rel="noreferrer"
      >
        ${esc(clean)} ↗
      </a>
    `;
  }

  if (pending) {
    title += `
      <span class="status-chip">
        Pending Confirmation
      </span>
    `;
  }

  return title;
}


function eventDetail(event) {

  const detail = linkify(event[4]);

  if (event[2] !== "Flight" || !event[5]) {
    return detail;
  }

  const flightNumber = event[4].split(" · ")[0];

  return `
    <a
      href="${esc(event[5])}"
      target="_blank"
      rel="noreferrer"
    >
      ${esc(flightNumber)} ↗
    </a>${detail.slice(esc(flightNumber).length)}
  `;
}


function renderFilters() {

  document.getElementById("filters").innerHTML =
    Object.entries(meta)
      .map(([type, [icon, className]]) => `
        <label class="filter">
          <input
            type="checkbox"
            data-type="${type}"
            checked
          >

          <span>${type}</span>

          <span class="chip ${className}">
            ${icon}
          </span>

        </label>
      `)
      .join("");


  document.querySelectorAll("[data-type]").forEach(input => {

    input.addEventListener("change", () => {

      if (input.checked) {
        active.add(input.dataset.type);
      } else {
        active.delete(input.dataset.type);
      }

      renderTimeline();
    });

  });
}

function stayFoodDropdown(event) {
  const key = cleanTitle(event[3]);
  const spots = (STAY_FOOD[key] || []).filter(s => !s.s || parseFloat(s.s) >= 4);
  if (!spots.length) return "";

  const items = spots.map(s => {
    const stars = s.s
      ? ` <span class="stars">★ ${esc(s.s)}${s.c ? ` (${esc(s.c)})` : ""}</span>`
      : "";
    return `
    <a
      class="food-item"
      href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.q)}"
      target="_blank"
      rel="noreferrer"
    >
      <strong>${esc(s.name)}${stars}</strong>
      <span>${esc(s.info)}</span>
    </a>
  `;
  }).join("");

  return `
    <div class="stay-food">
      <button
        class="food-toggle"
        type="button"
        aria-expanded="false"
      >
        🍜 Nearby restaurants <span class="chev">▾</span>
      </button>
      <div class="food-dropdown" hidden>
        ${items}
      </div>
    </div>
  `;
}

document.getElementById("timeline").addEventListener("click", (e) => {
  const btn = e.target.closest(".food-toggle");
  if (!btn) {
    // Clicked outside any food toggle — close all open dropdowns
    document.querySelectorAll(".food-dropdown:not([hidden])").forEach(d => {
      d.hidden = true;
      const b = d.previousElementSibling;
      b.setAttribute("aria-expanded", "false");
      b.querySelector(".chev").textContent = "▾";
      d.closest(".day-card")?.classList.remove("food-open");
      d.closest("article.day")?.classList.remove("food-open");
    });
    return;
  }
  const dd = btn.nextElementSibling;
  const day = btn.closest("article.day");
  const open = dd.hidden;
  document.querySelectorAll(".food-dropdown:not([hidden])").forEach(d => {
    if (d !== dd) {
      d.hidden = true;
      const b = d.previousElementSibling;
      b.setAttribute("aria-expanded", "false");
      b.querySelector(".chev").textContent = "▾";
      d.closest(".day-card")?.classList.remove("food-open");
      d.closest("article.day")?.classList.remove("food-open");
    }
  });
  dd.hidden = !open;
  btn.setAttribute("aria-expanded", String(open));
  btn.querySelector(".chev").textContent = open ? "▴" : "▾";
  btn.closest(".day-card")?.classList.toggle("food-open", open);
  day?.classList.toggle("food-open", open);
});

function renderTimeline() {

  const groups = [];


  events.forEach(event => {

    let group = groups.find(
      item =>
        item.date === event[0] &&
        item.place === event[1]
    );


    if (!group) {

      group = {
        date: event[0],
        place: event[1],
        events: []
      };

      groups.push(group);
    }


    group.events.push(event);

  });


  document.getElementById("timeline").innerHTML =

    groups
      .map((group, index) => {

        const rows = group.events

          .filter(event =>
            active.has(event[2])
          )

          .filter(event =>
            searchMatches(event)
          )

          .map(event => {

            const [icon, className] =
              meta[event[2]];


            const title =
              renderTitle(event);


            const reservationButton =
              event[2] === "Stay"
                ? `
                  <button
                    class="reserve"
                    type="button"
                    data-title="${esc(cleanTitle(event[3]))}"
                    data-details="${esc(event[4] || "")}"
                    data-numbers="${esc(event[6] || "")}"
                  >
                    🔑 Reservations
                  </button>
                `
                : event[6]
                ? `
                  <button
                    class="reserve"
                    type="button"
                    data-title="${esc(cleanTitle(event[3]))}"
                    data-details=""
                    data-numbers="${esc(event[6])}"
                  >
                    🔑 Reservations
                  </button>
                `
                : "";


            const detail =
              event[2] === "Stay"
                ? ""
                : event[4] &&
                  !hidden.has(event[4])

                ? `
                  <p class="detail">
                    ${eventDetail(event)}
                  </p>
                `

                : "";


            const foodLink =
              event[2] === "Stay"
                ? stayFoodDropdown(event)
                : "";


            return `
              <div class="event">

                <div class="event-icon ${className}">
                  ${icon}
                </div>

                <div class="event-body">

                  <div class="type">
                    ${event[2]}
                  </div>

                  <div class="event-title-row">

                    <h3>
                      ${title}
                    </h3>

                    ${reservationButton}

                  </div>

                  ${detail}

                  ${foodLink}

                </div>

              </div>
            `;

          })

          .join("")

          || `
            <div class="empty">
              No selected event types for this day.
            </div>
          `;


        return `
          <article
            class="day"
            style="animation-delay:${index * 25}ms"
          >

            <div class="date">
              ${formatDayLabel(group.date)}
            </div>


            <div class="day-card">

              <button
                class="day-head"
                type="button"
                aria-expanded="true"
              >

                <span>

                  <span class="dest">
                    ⌖ Destination
                  </span>

                  <span class="place">
                    ${esc(group.place)}
                  </span>

                </span>

                <span class="chev">
                  ⌄
                </span>

              </button>


              <div class="events">
                ${rows}
              </div>

            </div>

          </article>
        `;

      })

      .join("");


  document
    .querySelectorAll(".day-head")
    .forEach(button => {

      button.addEventListener("click", () => {

        const card =
          button.closest(".day-card");

        card.classList.toggle("collapsed");

        button.setAttribute(
          "aria-expanded",
          String(
            !card.classList.contains("collapsed")
          )
        );

      });

    });


  document
    .querySelectorAll(".reserve")
    .forEach(button => {

      button.addEventListener("click", () => {

        openModal(
          button.dataset.title,
          button.dataset.details || "",
          button.dataset.numbers || ""
        );

      });

    });

}

function openModal(title, details, numbers) {

  document.getElementById("modalTitle")
    .textContent = title;

  let html = "";
  if (details) {
    html += esc(details) + "<br><br>";
  }
  if (numbers) {
    html += numbers
      .split("|")
      .map(esc)
      .join("<br>");
  }

  document.getElementById("modalNumbers")
    .innerHTML = html;


  modal.showModal();
}


document
  .getElementById("closeModal")
  .addEventListener("click", () => {

    modal.close();

  });

    modal.close();
  }

});

function updateCountdown() {

  const timeLeft =
    Math.max(
      0,
      departure - Date.now()
    );


  if (!timeLeft) {

    document.getElementById(
      "countdownLabel"
    ).textContent =
      "The journey has begun";


    document.getElementById(
      "units"
    ).innerHTML = "";

    return;
  }


  const values = [

    [
      Math.floor(
        timeLeft / 86400000
      ),
      "days"
    ],

    [
      Math.floor(
        timeLeft / 3600000
      ) % 24,
      "hours"
    ],

    [
      Math.floor(
        timeLeft / 60000
      ) % 60,
      "mins"
    ],

    [
      Math.floor(
        timeLeft / 1000
      ) % 60,
      "secs"
    ]

  ];


  document.getElementById("units")
    .innerHTML = values

      .map(([value, label]) => `

        <div class="unit">

          <div class="num">
            ${String(value).padStart(2, "0")}
          </div>

          <small>
            ${label}
          </small>

        </div>

      `)

      .join("");

}


updateCountdown();

setInterval(
  updateCountdown,
  1000
);

let printSnapshot = null;


function prepareFullPrint() {

  if (!printSnapshot) {
    printSnapshot =
      [...active];
  }


  Object.keys(meta)
    .forEach(type =>
      active.add(type)
    );


  renderTimeline();


  document
    .querySelectorAll(".day-card")
    .forEach(card => {

      card.classList.remove(
        "collapsed"
      );

    });

}


function restoreAfterPrint() {

  if (!printSnapshot) {
    return;
  }


  active.clear();


  printSnapshot.forEach(type =>
    active.add(type)
  );


  printSnapshot = null;


  renderTimeline();

}


function printFullItinerary() {

  prepareFullPrint();


  setTimeout(() => {

    window.print();

  }, 0);

}


window.addEventListener(
  "beforeprint",
  prepareFullPrint
);


window.addEventListener(
  "afterprint",
  restoreAfterPrint
);


document
  .getElementById("printBtn")
  .addEventListener(
    "click",
    printFullItinerary
  );


renderFilters();
renderTimeline();

];

function escHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function renderTrainSchedule() {
  const el = document.getElementById("trainView");
  if (!el) return;

  let html = `<div class="train-warn">⚠️ <b>Draft — re-verify before travel.</b> The November 2026 timetable isn't published yet (JR releases timetables ~1 month ahead). Times below come from the official JR Central timetable effective March 14, 2026 and established service patterns. Re-check on Jorudan or at a JR ticket office in early November. Group of 5 traveling together. <b>Nothing is booked.</b></div>`;

  TRAIN_LEGS.forEach(L => {
    html += `<article class="train-card">
      <div class="train-head">
        <div class="train-leg">🚄</div>
        <div class="train-route">
          <div class="t-title">Leg ${L.leg} — ${escHtml(L.route)}</div>
          <div class="t-sub">${escHtml(L.date)} · ${escHtml(L.service)}</div>
        </div>
        <div class="train-fare">${escHtml(L.fare)}<br><span style="font-weight:400;font-size:11px;opacity:.8">per person</span></div>
      </div>
      <div class="train-body">`;

    if (L.chips.length) {
      html += `<div class="train-meta">` + L.chips.map(c => `<span class="train-chip">${escHtml(c)}</span>`).join("") + `</div>`;
    }
    if (L.alert) {
      html += `<div class="train-alert">${L.alert}</div>`;
    }

    html += `<div style="overflow-x:auto"><table class="train-opts"><thead><tr><th></th>${L.optHeaders.map(h => `<th>${escHtml(h)}</th>`).join("")}<th>Notes</th></tr></thead><tbody>`;
    L.options.forEach(o => {
      html += `<tr class="${o.best ? "best" : ""}"><td><span class="opt-tag">${o.tag}</span>${o.best ? " <b>Best</b>" : ""}</td>${o.cols.map(c => `<td>${escHtml(c)}</td>`).join("")}<td>${escHtml(o.note)}</td></tr>`;
    });
    html += `</tbody></table></div>`;

    if (L.note) {
      html += `<div class="train-note">${escHtml(L.note)}</div>`;
    }

    html += `</div></article>`;
  });

  html += `<section class="train-summary">
    <h3>💴 Pricing summary <span style="font-weight:400;font-size:13px;color:#6a7f90">(adult, per person)</span></h3>
    <div class="s-sub">Fares marked ~ are approximate — confirm exact station-pair fares at a JR ticket office or via SmartEX.</div>
    <table class="train-opts"><tbody>`;
  TRAIN_PRICING.forEach(([label, fare]) => {
    html += `<tr><td>${escHtml(label)}</td><td style="text-align:right;font-weight:700;white-space:nowrap">${escHtml(fare)}</td></tr>`;
  });
  html += `</tbody></table>
    <div class="train-total"><span>Total per person</span><span>~¥37,770</span></div>
    <div class="train-total" style="border-top:none;padding-top:2px"><span>Total for 4 (Brandon's group)</span><span>~¥151,080 (~$953)</span></div>
    <div class="train-compare"><b>vs 7-day JR Pass:</b> 4 × ¥50,000 (JR direct) = ¥200,000 → individual tickets save ~¥48,920 (~$309). <b>Verdict: skip the passes, buy tickets as you go.</b></div>
    <div class="train-compare" style="margin-top:8px"><b>Group tips:</b> Reserve Shinkansen seats (5 together won't happen in non-reserved, especially mornings) via the <a href="https://smart-ex.jp/en/" target="_blank" rel="noopener">SmartEX app</a> or a JR ticket office. Bags over 160 cm (H+W+D) need oversized-baggage seats. Load Suica/ICOCA for local trains.</div>
  </section>`;

  el.innerHTML = html;
}

renderTrainSchedule();

document.querySelectorAll(".view-tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".view-tab").forEach(t => {
      t.classList.remove("active");
      t.setAttribute("aria-selected", "false");
    });
    tab.classList.add("active");
    tab.setAttribute("aria-selected", "true");

    const view = tab.dataset.view;
    document.getElementById("timeline").hidden = view !== "timeline";
    const controls = document.querySelector(".controls");
    if (controls) controls.hidden = view !== "timeline";
    document.getElementById("map").hidden = view !== "map";
    document.getElementById("trainView").hidden = view !== "trains";
  });
});
