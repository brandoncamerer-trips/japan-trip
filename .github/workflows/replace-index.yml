name: Replace index.html with grouped Nov 2 version
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-nov2-grouping
      - name: Replace index.html and clean up temp files
        run: |
          set -euo pipefail
          curl -sSL https://raw.githubusercontent.com/brandoncamerer-trips/japan-trip/refs/heads/fix-nov2-grouping/japantrip.html -o index.html
          test -s index.html
          git rm -q japantrip.html .github/workflows/replace-index.yml
          git config user.name "brandoncamerer-trips"
          git config user.email "brandoncamerer-trips@users.noreply.github.com"
          git add index.html
          git commit -m "Group Nov 2 events into a single timeline card"
          git push origin fix-nov2-grouping
