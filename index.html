<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="A complete interactive itinerary for Japan Journey 2026.">

<title>Japan Journey 2026</title>

<style>
:root {
  --bg: #f2f5f2;
  --ink: #183246;
  --card: #fffdf8;
  --muted: #687974;
  --line: #d7e0db;
  --navy: #12364d;
  --red: #b54841;
  --gold: #d6aa4d;
  --green: #34796c;
  --shadow: 0 14px 42px rgba(18, 48, 66, .09);
  color-scheme: light;
}

html[data-theme="dark"] {
  --bg: #09171f;
  --ink: #e6efec;
  --card: #10242d;
  --muted: #a3b3af;
  --line: #29414a;
  --navy: #0a2432;
  --shadow: 0 14px 42px rgba(0, 0, 0, .24);
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  transition: .25s;
}

button,
a {
  font: inherit;
}

button {
  cursor: pointer;
}

a {
  color: inherit;
}

button:focus-visible,
a:focus-visible,
input:focus-visible {
  outline: 3px solid #e6a85a;
  outline-offset: 3px;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(16, 47, 69, .96);
  border-bottom: 1px solid #ffffff18;
  color: #fff;
  box-shadow: 0 8px 24px #102f451c;
}

.topbar-inner {
  max-width: 1120px;
  height: 64px;
  margin: auto;
  padding: 0 20px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand {
  font-weight: 800;
}

.top-actions {
  margin-left: auto;
  display: flex;
  gap: 6px;
}

.icon-btn {
  width: 40px;
  height: 40px;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: #fff;
  font-size: 18px;
}

.icon-btn:hover {
  background: #ffffff18;
}

.icon-btn svg {
  display: block;
  width: 19px;
  height: 19px;
  margin: auto;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.hero {
  position: relative;
  overflow: hidden;
  background: linear-gradient(125deg, #102f45, #163e54 58%, #285f66);
  color: #fff;
  text-align: center;
}

.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  opacity: .1;
  background-image:
    linear-gradient(#ffffff2e 1px, transparent 1px),
    linear-gradient(90deg, #ffffff2e 1px, transparent 1px);
  background-size: 56px 56px;
}

.hero-inner {
  position: relative;
  max-width: 1120px;
  margin: auto;
  padding: 42px 20px 46px;
}

.eyebrow {
  color: #f3d99b;
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .22em;
}

.kanji {
  margin: 8px 0 2px;
  color: #f3c977;
  font: 700 clamp(3.4rem, 8vw, 5.4rem) / .95 Georgia, serif;
  letter-spacing: -.04em;
  text-shadow: 0 8px 24px #0004;
}

.countdown {
  max-width: 420px;
  margin: 24px auto 0;
  padding: 12px 14px;
  border: 1px solid #ffffff22;
  border-radius: 18px;
  background: #ffffff12;
  backdrop-filter: blur(10px);
}

.countdown-label {
  margin-bottom: 8px;
  color: #f3d99b;
  font-size: 9px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .2em;
}

.units {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
}

.unit + .unit {
  border-left: 1px solid #ffffff22;
}

.num {
  font: 500 24px Georgia, serif;
  font-variant-numeric: tabular-nums;
}

.unit small {
  display: block;
  margin-top: 3px;
  color: #ffffff88;
  font-size: 8px;
  text-transform: uppercase;
  letter-spacing: .14em;
}

/* Refresh Schedule button */
.refresh-schedule {
  margin: 14px auto 0;
  padding: 9px 16px;
  border: 1px solid #ffffff33;
  border-radius: 999px;
  background: #ffffff12;
  color: #fff;
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
  backdrop-filter: blur(8px);
  transition: .2s;
}

.refresh-schedule:hover {
  background: #ffffff22;
  transform: translateY(-1px);
}

.refresh-schedule:active {
  transform: translateY(0);
}

/* Last refreshed timestamp */
.last-refreshed {
  margin-top: 8px;
  color: #ffffff88;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .06em;
}

.page {
  max-width: 1120px;
  margin: auto;
  padding: 36px 18px 64px;
}

.controls {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 20px;
  margin-bottom: 34px;
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: color-mix(in srgb, var(--card) 96%, transparent);
  box-shadow: var(--shadow);
}

.controls-title {
  margin: 0 0 11px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .16em;
}

.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.filter {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--card);
  color: var(--ink);
  font-size: 14px;
  font-weight: 700;
  user-select: none;
}

.filter:has(input:not(:checked)) {
  opacity: .52;
  background: transparent;
}

.filter input {
  width: 16px;
  height: 16px;
  accent-color: var(--red);
}

.chip {
  display: grid;
  place-items: center;
  width: 25px;
  height: 25px;
  border-radius: 8px;
}

.flight {
  background: #f9e5e1;
  color: #a33f39;
}

.rail {
  background: #f8efd7;
  color: #84601c;
}

.visit {
  background: #e2f0eb;
  color: #286e62;
}

.stay {
  background: #e7eef4;
  color: #315e7e;
}

/* Pending confirmation status chip */
.status-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin-left: 8px;
  padding: 4px 8px;
  border: 1px solid #dcc98e;
  border-radius: 999px;
  background: #fff7dc;
  color: #80611e;
  font-size: 9px;
  font-weight: 900;
  line-height: 1;
  text-transform: uppercase;
  letter-spacing: .08em;
  white-space: nowrap;
  vertical-align: middle;
}

.status-chip::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #d6aa4d;
  box-shadow: 0 0 0 2px #d6aa4d22;
}

html[data-theme="dark"] .status-chip {
  border-color: #69582b;
  background: #302b20;
  color: #e4c978;
}

html[data-theme="dark"] .status-chip::before {
  background: #d6aa4d;
  box-shadow: 0 0 0 2px #d6aa4d22;
}

.control-actions {
  display: flex;
  width: 100%;
}

.map-btn,
.done {
  min-height: 44px;
  padding: 0 17px;
  border: 1px solid #b9cec6;
  border-radius: 12px;
  background: #e2efea;
  color: #1f665b;
  font-weight: 800;
  white-space: nowrap;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.map-btn {
  width: 100%;
}

.map-btn:hover {
  filter: brightness(.97);
}

.timeline {
  position: relative;
}

.timeline::before {
  content: "";
  position: absolute;
  top: 30px;
  bottom: 30px;
  left: 38px;
  width: 2px;
  background: linear-gradient(
    var(--red),
    var(--gold) 38%,
    var(--green) 76%,
    var(--navy)
  );
}

.day {
  position: relative;
  display: grid;
  grid-template-columns: 76px minmax(0, 1fr);
  gap: 26px;
  padding-bottom: 20px;
  animation: rise .45s both;
}

.date {
  z-index: 2;
  width: 76px;
  height: 60px;
  display: grid;
  place-items: center;
  border: 4px solid var(--bg);
  border-radius: 16px;
  background: #173b53;
  color: #fff;
  box-shadow: 0 8px 20px #173b532c;
  font-size: 12px;
  font-weight: 900;
  letter-spacing: .08em;
  line-height: 1.35;
  text-align: center;
}
.date-wd {
  font-size: 10px;
  font-weight: 700;
  opacity: .75;
  letter-spacing: .12em;
}

.day-card {
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: var(--card);
  box-shadow: var(--shadow);
  transition: .2s;
}

.day-card:hover {
  transform: translateY(-1px);
}

.day-head {
  width: 100%;
  padding: 17px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  border: 0;
  background: linear-gradient(105deg, #f7efdf, var(--card) 64%);
  color: var(--ink);
  text-align: left;
}

html[data-theme="dark"] .day-head {
  background: linear-gradient(105deg, #302b20, var(--card) 64%);
}

.dest {
  display: block;
  margin-bottom: 3px;
  color: #a57b36;
  font-size: 10px;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: .15em;
}

.place {
  font: 700 clamp(19px, 3vw, 24px) Georgia, serif;
}

.chev {
  font-size: 20px;
  transition: .2s;
}

.collapsed .chev {
  transform: rotate(-90deg);
}

.events {
  border-top: 1px solid var(--line);
}

.collapsed .events {
  display: none;
}

.event {
  display: flex;
  gap: 14px;
  padding: 16px 20px;
}

.event + .event {
  border-top: 1px solid var(--line);
}

.event-icon {
  width: 37px;
  height: 37px;
  flex: 0 0 37px;
  display: grid;
  place-items: center;
  border-radius: 11px;
}

.event-body {
  min-width: 0;
  flex: 1;
}

.type {
  color: var(--muted);
  font-size: 9px;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: .16em;
}

.event-title-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
}

.event h3 {
  margin: 2px 0 0;
  font-size: 16px;
  line-height: 1.45;
}

.event h3 a,
.detail a {
  color: var(--red);
  text-decoration-color: #d6534866;
  text-underline-offset: 4px;
}

.detail {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.55;
}

.reserve {
  padding: 6px 10px;
  border: 1px solid #d8c79f;
  border-radius: 999px;
  background: #fff9eb;
  color: #7c5c1f;
  font-size: 12px;
  font-weight: 800;
}

.empty {
  padding: 24px;
  color: var(--muted);
}

.modal {
  width: min(430px, calc(100% - 32px));
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--card);
  color: var(--ink);
  box-shadow: 0 30px 90px #0006;
}

.modal::backdrop {
  background: #07151db3;
  backdrop-filter: blur(4px);
}

.modal-stripe {
  height: 8px;
  background: linear-gradient(90deg, var(--red), var(--gold), var(--green));
}

.modal-inner {
  padding: 30px;
  text-align: center;
}

.key {
  width: 58px;
  height: 58px;
  margin: auto;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: #e5f1ec;
  font-size: 25px;
}

.modal-label {
  margin: 14px 0 5px;
  color: var(--red);
  font-size: 10px;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: .2em;
}

.modal h2 {
  margin: 0;
  font: 700 25px Georgia, serif;
}

.modal p {
  color: var(--muted);
}

.numbers {
  margin: 22px 0;
  padding: 15px 0;
  border-block: 1px solid var(--line);
  font: 700 18px ui-monospace, monospace;
  line-height: 1.8;
}

.done {
  width: 100%;
  border-color: #173b53;
  background: #173b53;
  color: #fff;
}

@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(10px);
  }

  to {
    opacity: 1;
    transform: none;
  }
}

@media (max-width: 650px) {
  .hero-inner {
    padding: 34px 18px 38px;
  }

  .map-btn {
    width: 100%;
    text-align: center;
  }

  .timeline::before {
    left: 29px;
  }

  .day {
    grid-template-columns: 58px minmax(0, 1fr);
    gap: 14px;
  }

  .date {
    width: 58px;
    height: 56px;
    font-size: 10px;
  }

  .day-head,
  .event {
    padding: 14px;
  }

  .event-title-row {
    display: block;
  }

  .reserve {
    margin-top: 8px;
  }

  .status-chip {
    margin-left: 0;
    margin-top: 8px;
  }

  .event-icon {
    width: 34px;
    height: 34px;
    flex-basis: 34px;
  }
}

@media (prefers-reduced-motion: reduce) {
  * {
    scroll-behavior: auto !important;
    animation-duration: 1ms !important;
    transition-duration: 1ms !important;
  }
}

@media print {
  @page {
    size: letter;
    margin: .42in;
  }

  html,
  body {
    background: #fff !important;
    color: #183246 !important;
  }

  .topbar,
  .controls,
  .modal,
  .reserve,
  .refresh-schedule,
  .last-refreshed {
    display: none !important;
  }

  .hero {
    background: #173b53 !important;
    print-color-adjust: exact;
    -webkit-print-color-adjust: exact;
  }

  .hero-inner {
    padding: 12px;
  }

  .kanji {
    font-size: 34px;
    text-shadow: none;
  }

  .eyebrow {
    font-size: 9px;
  }

  .countdown {
    display: none;
  }

  .page {
    max-width: none;
    padding: 14px 0;
  }

  .day {
    break-inside: avoid;
    padding-bottom: 7px;
    animation: none;
  }

  .date {
    border-color: #fff;
    print-color-adjust: exact;
    -webkit-print-color-adjust: exact;
  }

  .day-card {
    box-shadow: none;
    transform: none !important;
  }

  .collapsed .events {
    display: block !important;
  }

  .day-head {
    padding: 8px 12px;
  }

  .chev {
    display: none;
  }

  .event {
    padding: 7px 12px;
  }

  .event h3 {
    font-size: 12px;
  }

  .detail {
    font-size: 10px;
  }

  .timeline::before {
    display: none;
  }

  .status-chip {
    print-color-adjust: exact;
    -webkit-print-color-adjust: exact;
  }
}
</style>
</head>

<header class="topbar">

    <div class="brand">Japan Journey 2026</div>

    <div class="top-actions">
      <button
        class="icon-btn"
        id="printBtn"
        type="button"
        aria-label="Print itinerary"

        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 9V3h12v6"></path>

          <rect x="6" y="14" width="12" height="7" rx="1"></rect>
          <path d="M18 12h.01"></path>
        </svg>

      <button
        class="icon-btn"
        id="themeBtn"
        type="button"
        aria-label="Switch theme"
        title="Switch theme"
      >
        ☾
      </button>
    </div>
  </div>
</header>

<main id="top">

  <section class="hero">
    <div class="hero-inner">
      <div class="eyebrow">November 2–13 · 2026</div>

      <div class="kanji" aria-label="Jesus">イエス</div>

      <div class="countdown" role="timer" aria-live="polite">
        <div class="countdown-label" id="countdownLabel">
          Until departure
        </div>

        <div class="units" id="units"></div>
      </div>

      <button
        class="refresh-schedule"
        id="refreshScheduleBtn"
        type="button"
      >
        ↻ Refresh Schedule
      </button>

      <div
        class="last-refreshed"
        id="lastRefreshed"
        aria-live="polite"
      ></div>

    </div>
  </section>

  <section class="page">

    <div class="controls">
      <div>
        <p class="controls-title">Show on timeline</p>
        <div class="filters" id="filters"></div>
      </div>
    </div>

    <div class="timeline" id="timeline"></div>

  </section>
</main>

<dialog class="modal" id="modal">
  <div class="modal-stripe"></div>

  <div class="modal-inner">
    <div class="key">🔑</div>
    <div class="modal-label">Hotel reservation</div>
    <h2 id="modalTitle"></h2>

    <p>Keep these confirmation numbers handy for check-in.</p>

    <div class="numbers" id="modalNumbers"></div>

    <button class="done" id="closeModal" type="button">
      Done
    </button>
  </div>
</dialog>

const meta = {
  Flight: ["✈", "flight"],
  Rail: ["▲", "rail"],
  Car: ["🚗", "car"],
  Visit: ["◎", "visit"],
  Stay: ["▤", "stay"]
};


const hidden = new Set([
  "Full-day visit",
  "Overnight at Haneda Airport",
  "Afternoon transfer",
  "Explore the historic city",
  "Rail transfer",
  "Lodging to be confirmed",
  "Saitama area visit",
  "Return stay at Haneda Airport"
]);


const active = new Set(Object.keys(meta));


const esc = value => String(value).replace(
  /[&<>"']/g,
  character => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[character]
);


const linkify = value => esc(value).replace(
  /([\w.+-]+@[\w.-]+\.[A-Za-z]{2,})/g,
  '<a href="mailto:$1">$1</a>'
);


function hasPendingConfirmation(title) {
  return /pending confirmation/i.test(title);
}


function cleanTitle(title) {
  return title
    .replace(/\s*\([^)]*pending confirmation[^)]*\)/i, "")
    .trim();
}


const WEEKDAYS = {"Nov. 2":"MON","Nov. 3":"TUE","Nov. 4":"WED","Nov. 5":"THU","Nov. 6":"FRI","Nov. 7":"SAT","Nov. 8":"SUN","Nov. 9":"MON","Nov. 10":"TUE","Nov. 11":"WED","Nov. 12":"THU","Nov. 13":"FRI"};
function formatDayLabel(dateStr) {
  const wd = WEEKDAYS[dateStr] ? `<span class="date-wd">${WEEKDAYS[dateStr]}</span>` : "";
  const dt = dateStr.replace("Nov. ", "NOV ");
  return wd ? `${wd}<br>${dt}` : dt;
}


function renderTitle(event) {

  const pending = hasPendingConfirmation(event[3]);
  const clean = cleanTitle(event[3]);

  let title;

  if (event[2] === "Flight" || !event[5]) {
    title = esc(clean);
  } else {
    title = `
      <a
        href="${esc(event[5])}"
        target="_blank"
        rel="noreferrer"
      >
        ${esc(clean)} ↗
      </a>
    `;
  }

  if (pending) {
    title += `
      <span class="status-chip">
        Pending Confirmation
      </span>
    `;
  }

  return title;
}


function eventDetail(event) {

  const detail = linkify(event[4]);

  if (event[2] !== "Flight" || !event[5]) {
    return detail;
  }

  const flightNumber = event[4].split(" · ")[0];

  return `
    <a
      href="${esc(event[5])}"
      target="_blank"
      rel="noreferrer"
    >
      ${esc(flightNumber)} ↗
    </a>${detail.slice(esc(flightNumber).length)}
  `;
}


function renderFilters() {

  document.getElementById("filters").innerHTML =
    Object.entries(meta)
      .map(([type, [icon, className]]) => `
        <label class="filter">
          <input
            type="checkbox"
            data-type="${type}"
            checked
          >

          <span>${type}</span>

          <span class="chip ${className}">
            ${icon}
          </span>

        </label>
      `)
      .join("");


  document.querySelectorAll("[data-type]").forEach(input => {

    input.addEventListener("change", () => {

      if (input.checked) {
        active.add(input.dataset.type);
      } else {
        active.delete(input.dataset.type);
      }

      renderTimeline();
    });

  });
}


function renderTimeline() {

  const groups = [];


  events.forEach(event => {

    let group = groups.find(
      item =>
        item.date === event[0] &&
        item.place === event[1]
    );


    if (!group) {

      group = {
        date: event[0],
        place: event[1],
        events: []
      };

      groups.push(group);
    }


    group.events.push(event);

  });


  document.getElementById("timeline").innerHTML =

    groups
      .map((group, index) => {

        const rows = group.events

          .filter(event =>
            active.has(event[2])
          )

          .map(event => {

            const [icon, className] =
              meta[event[2]];


            const title =
              renderTitle(event);


            const reservationButton =
              event[6]
                ? `
                  <button
                    class="reserve"
                    type="button"
                    data-title="${esc(cleanTitle(event[3]))}"
                    data-numbers="${esc(event[6])}"
                  >
                    🔑 Reservations
                  </button>
                `
                : "";


            const detail =
              event[4] &&
              !hidden.has(event[4])

                ? `
                  <p class="detail">
                    ${eventDetail(event)}
                  </p>
                `

                : "";


            return `
              <div class="event">

                <div class="event-icon ${className}">
                  ${icon}
                </div>

                <div class="event-body">

                  <div class="type">
                    ${event[2]}
                  </div>

                  <div class="event-title-row">

                    <h3>
                      ${title}
                    </h3>

                    ${reservationButton}

                  </div>

                  ${detail}

                </div>

              </div>
            `;

          })

          .join("")

          || `
            <div class="empty">
              No selected event types for this day.
            </div>
          `;


        return `
          <article
            class="day"
            style="animation-delay:${index * 25}ms"
          >

            <div class="date">
              ${formatDayLabel(group.date)}
            </div>


            <div class="day-card">

              <button
                class="day-head"
                type="button"
                aria-expanded="true"
              >

                <span>

                  <span class="dest">
                    ⌖ Destination
                  </span>

                  <span class="place">
                    ${esc(group.place)}
                  </span>

                </span>

                <span class="chev">
                  ⌄
                </span>

              </button>


              <div class="events">
                ${rows}
              </div>

            </div>

          </article>
        `;

      })

      .join("");


  document
    .querySelectorAll(".day-head")
    .forEach(button => {

      button.addEventListener("click", () => {

        const card =
          button.closest(".day-card");

        card.classList.toggle("collapsed");

        button.setAttribute(
          "aria-expanded",
          String(
            !card.classList.contains("collapsed")
          )
        );

      });

    });


  document
    .querySelectorAll(".reserve")
    .forEach(button => {

      button.addEventListener("click", () => {

        openModal(
          button.dataset.title,
          button.dataset.numbers
        );

      });

    });

}


const modal =
  document.getElementById("modal");


function openModal(title, numbers) {

  document.getElementById("modalTitle")
    .textContent = title;


  document.getElementById("modalNumbers")
    .innerHTML = numbers
      .split("|")
      .map(esc)
      .join("<br>");


  modal.showModal();
}


document
  .getElementById("closeModal")
  .addEventListener("click", () => {

    modal.close();

  });


modal.addEventListener("click", event => {

  if (event.target === modal) {
    modal.close();
  }

});


const departure =
  new Date(
    "2026-11-03T15:40:00-08:00"
  ).getTime();


function updateCountdown() {

  const timeLeft =
    Math.max(
      0,
      departure - Date.now()
    );


  if (!timeLeft) {

    document.getElementById(
      "countdownLabel"
    ).textContent =
      "The journey has begun";


    document.getElementById(
      "units"
    ).innerHTML = "";

    return;
  }


  const values = [

    [
      Math.floor(
        timeLeft / 86400000
      ),
      "days"
    ],

    [
      Math.floor(
        timeLeft / 3600000
      ) % 24,
      "hours"
    ],

    [
      Math.floor(
        timeLeft / 60000
      ) % 60,
      "mins"
    ],

    [
      Math.floor(
        timeLeft / 1000
      ) % 60,
      "secs"
    ]

  ];


  document.getElementById("units")
    .innerHTML = values

      .map(([value, label]) => `

        <div class="unit">

          <div class="num">
            ${String(value).padStart(2, "0")}
          </div>

          <small>
            ${label}
          </small>

        </div>

      `)

      .join("");

}


updateCountdown();

setInterval(
  updateCountdown,
  1000
);


/*
  Refresh Schedule

  Adds a unique timestamp to the URL so the browser
  requests a fresh copy of the HTML instead of relying
  on the previously cached page.
*/
document
  .getElementById("refreshScheduleBtn")
  .addEventListener("click", () => {

    const url = new URL(window.location.href);

    url.searchParams.set(
      "v",
      Date.now()
    );

    window.location.href =
      url.toString();

  });


/*
  Last refreshed timestamp

  This is generated when the fresh page loads.
*/
function updateLastRefreshed() {

  const now = new Date();

  const formatted =
    now.toLocaleString(
      undefined,
      {
        year: "numeric",
        month: "long",
        day: "numeric",
        hour: "numeric",
        minute: "2-digit",
        second: "2-digit"
      }
    );

  document.getElementById(
    "lastRefreshed"
  ).textContent =
    "Last refreshed: " + formatted;

}


updateLastRefreshed();


const root =
  document.documentElement;

const themeButton =
  document.getElementById("themeBtn");


let savedTheme = null;


try {

  savedTheme =
    localStorage.getItem(
      "japan-journey-theme"
    );

} catch (error) {

  // Local storage may be unavailable.

}


if (savedTheme) {
  root.dataset.theme =
    savedTheme;
}


function updateThemeIcon() {

  themeButton.textContent =
    root.dataset.theme === "dark"
      ? "☀"
      : "☾";

}


updateThemeIcon();


themeButton.addEventListener(
  "click",
  () => {

    root.dataset.theme =
      root.dataset.theme === "dark"
        ? "light"
        : "dark";


    try {

      localStorage.setItem(
        "japan-journey-theme",
        root.dataset.theme
      );

    } catch (error) {

      // Local storage may be unavailable.

    }


    updateThemeIcon();

  }
);


let printSnapshot = null;


function prepareFullPrint() {

  if (!printSnapshot) {
    printSnapshot =
      [...active];
  }


  Object.keys(meta)
    .forEach(type =>
      active.add(type)
    );


  renderTimeline();


  document
    .querySelectorAll(".day-card")
    .forEach(card => {

      card.classList.remove(
        "collapsed"
      );

    });

}


function restoreAfterPrint() {

  if (!printSnapshot) {
    return;
  }


  active.clear();


  printSnapshot.forEach(type =>
    active.add(type)
  );


  printSnapshot = null;


  renderTimeline();

}


function printFullItinerary() {

  prepareFullPrint();


  setTimeout(() => {

    window.print();

  }, 0);

}


window.addEventListener(
  "beforeprint",
  prepareFullPrint
);


window.addEventListener(
  "afterprint",
  restoreAfterPrint
);


document
  .getElementById("printBtn")
  .addEventListener(
    "click",
    printFullItinerary
  );


renderFilters();
renderTimeline();

</script>
